<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --wire: #f4f4f4;
      --sig: #ff3e00;
      --halo: rgba(255, 62, 0, 0.38);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --wire: #181818;
      }
    }
  </style>
  <!-- Classic Browser Fallback Globe Wireframe -->
  <circle cx="16" cy="16" r="13" stroke="var(--wire)" stroke-width="2.2" />
  <line x1="3" y1="16" x2="29" y2="16" stroke="var(--wire)" stroke-width="2.2" stroke-linecap="round" />
  <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="var(--wire)" stroke-width="2.2" />
  <!-- Custom Safety Orange Telemetry Beacon (Argentina: -34°S, -58°W) -->
  <circle cx="11.5" cy="21" r="3.4" fill="var(--halo)" />
  <circle cx="11.5" cy="21" r="2.2" fill="var(--sig)" />
</svg>