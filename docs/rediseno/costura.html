<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mateo Sonzogni — La costura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/*
 * La costura — versión de scroll.
 * Cada escena se ve primero como diseño. Al seguir bajando, la escena se fija y una línea la cruza
 * de derecha a izquierda: detrás de la línea queda el registro que la construye. Después, la siguiente.
 * El único control es el scroll.
 */
@font-face{font-family:'General Sans';src:url('../../app/assets/fonts/GeneralSans-Variable.woff2') format('woff2');font-weight:200 700;font-display:swap}
:root{
  --night:#0b0b0c;--ink:#ededee;--dim:rgba(237,237,238,.64);
  --paper:#ecedec;--pink:#121315;--pdim:#5b5c62;--prule:rgba(18,19,21,.14);
  --sig:#ff3e00;--ok:#3ecf6e;--wip:#e5a00d;
  --sans:'General Sans',system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,monospace;
  --pad:clamp(1rem,3.2vw,3rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{background:var(--night);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:clip;font-weight:420}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}

/* ── Escena: dos caras superpuestas y la línea que las separa ───────────── */
.scene{position:relative;height:100svh;overflow:hidden}
/* Cada cara es su propio contexto de apilado: nada del diseño puede asomar sobre el registro */
.face{position:absolute;inset:0;padding:var(--pad);overflow:hidden;isolation:isolate}
.face.design{z-index:0;background:color-mix(in srgb,var(--tint,#0b0b0c) 16%,var(--night))}
.face.record{z-index:1;background:var(--paper);color:var(--pink);clip-path:inset(0 0 0 100%)}
.seam{position:absolute;top:0;bottom:0;left:100%;width:1px;background:var(--sig);z-index:5;pointer-events:none}
.seam .knot{position:absolute;top:50%;left:0;width:.6rem;height:.6rem;background:var(--sig);transform:translate(-50%,-50%)}
.seam .lbl{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.62rem;white-space:nowrap}
.seam .l{right:1rem;color:var(--ink)}
.seam .r{left:1rem;color:var(--pink)}

/* Las mismas zonas en las dos caras, así la línea corta lo mismo de los dos lados */
.top{position:absolute;top:calc(var(--pad) + 2.4rem);left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;gap:1rem;font-size:.8125rem;z-index:2}
.bottom{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(1.2rem,5vh,3rem);display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;z-index:2}
.side{position:absolute;left:var(--pad);top:clamp(6rem,22vh,13rem);z-index:2;max-width:min(31ch,40vw)}
.design .top{color:var(--dim)}
.record .top,.record .bottom{font-family:var(--mono);font-size:.7rem;color:var(--pdim)}
.record .top b{color:var(--pink);font-weight:500}

/* Diseño */
.huge{font-size:clamp(3.2rem,14.5vw,15rem);font-weight:560;letter-spacing:-.055em;line-height:.82;margin-left:-.04em}
.sq{display:inline-block;width:.13em;height:.13em;background:var(--sig);margin-left:.04em}
.title{font-size:clamp(2.6rem,9.6vw,10.5rem);font-weight:560;letter-spacing:-.05em;line-height:.86;max-width:11ch}
.side p{font-size:clamp(1rem,1.5vw,1.35rem);line-height:1.38}
.side.soft p{color:var(--dim);font-size:clamp(.95rem,1.2vw,1.1rem)}
.dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--ok);margin-right:.5rem;vertical-align:.08em}
.dot.WIP{background:var(--wip)}
.open{display:inline-flex;gap:.5rem;margin-top:.9rem;font-size:.875rem;border-bottom:1px solid rgba(237,237,238,.35);padding-bottom:.15rem;transition:border-color .3s}
.open:hover{border-color:var(--sig)}
.shot{position:absolute;inset:-6% 0;z-index:0}
/* Las portadas son capturas de sitios con su propio texto: un desenfoque leve deja que mande el título.
   La imagen nítida vive en el caso. */
.shot img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(1.05) blur(1.5px)}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(8,8,9,.93) 0%,rgba(8,8,9,.58) 45%,rgba(8,8,9,.4) 100%)}

/* Registro */
.r-big{font-family:var(--mono);font-size:clamp(1.4rem,4.4vw,4.6rem);letter-spacing:-.04em;line-height:1}
.r-big .k,.r-big .q{color:var(--pdim)}
.fields{position:absolute;top:clamp(6rem,20vh,11rem);right:var(--pad);width:min(44rem,56vw);font-family:var(--mono);font-size:clamp(.66rem,.8vw,.78rem);line-height:1.55}
.fields div{display:grid;grid-template-columns:minmax(8em,11.5em) minmax(0,1fr);gap:1.2em;padding:.6em 0;border-top:1px solid var(--prule)}
.fields dt{font-weight:500}
.fields .t{display:block;margin-top:.15em;font-weight:400;font-size:.88em;color:var(--pdim)}
.fields dd{white-space:pre-wrap;word-break:break-word}
.fields .null{color:var(--pdim)}
.r-lede{max-width:34ch;font-family:var(--mono);font-size:.72rem;line-height:1.6;color:var(--pdim);text-align:right}

/* Stack */
.cloud{position:absolute;left:var(--pad);right:var(--pad);top:clamp(6rem,20vh,10rem);font-size:clamp(1.6rem,4.6vw,5rem);font-weight:520;letter-spacing:-.035em;line-height:1.08}
.cloud span{color:rgba(237,237,238,.22)}
.cloud span.used{color:var(--ink)}
.cloud i{font-style:normal;color:rgba(237,237,238,.18);margin:0 .18em}
.techs{position:absolute;left:var(--pad);right:var(--pad);top:clamp(6rem,20vh,10rem);display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:0 2rem;font-family:var(--mono);font-size:clamp(.64rem,.8vw,.76rem)}
.techs div{display:grid;grid-template-columns:1fr 7.5em 3em 2em;gap:.6em;padding:.5em 0;border-top:1px solid var(--prule)}
.techs .t{color:var(--pdim)}

/* Contacto */
.mail{font-size:clamp(1.6rem,7.6vw,8.4rem);font-weight:560;letter-spacing:-.05em;line-height:.9;white-space:nowrap}
.links{display:flex;gap:1.5rem;font-size:.9375rem}
.links a{border-bottom:1px solid rgba(237,237,238,.3)}

/* Cabecera y pista, legibles sobre las dos caras */
.hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--pad) * .55) var(--pad);mix-blend-mode:difference;color:#fff;font-size:.8125rem;pointer-events:none}
.hud a{pointer-events:auto}
.hud .brand{font-weight:560}
.hud nav{display:flex;gap:1.25rem}
.cue{position:fixed;left:50%;bottom:1.2rem;z-index:40;transform:translateX(-50%);mix-blend-mode:difference;color:#fff;font-family:var(--mono);font-size:.64rem;white-space:nowrap;pointer-events:none}
.cue i{display:inline-block;width:1px;height:1.4rem;margin-left:.6rem;vertical-align:middle;background:currentColor;transform-origin:top;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Sin movimiento: las dos caras una debajo de la otra, sin fijar ni recortar */
.static .scene{height:auto}
.static .face{position:relative;min-height:100svh}
.static .face.record{clip-path:none}
.static .seam{display:none}

@media (max-width:760px){
  .fields{left:var(--pad);right:var(--pad);width:auto}
  .fields div{grid-template-columns:8.5em minmax(0,1fr)}
  .side{max-width:none;right:var(--pad)}
  .bottom{flex-direction:column;align-items:flex-start;gap:1rem}
  .r-lede{text-align:left}
  .hud nav{display:none}
  .cue-long{display:none}
  .techs div{grid-template-columns:1fr 6.5em 2.6em}
  .techs .n{display:none}
}
@media (prefers-reduced-motion:reduce){.cue i{animation:none}}
</style>
</head>
<body>
<header class="hud">
  <a class="brand" href="#inicio">Mateo Sonzogni</a>
  <nav aria-label="Secciones"><a href="#obra">Obra</a><a href="#stack">Stack</a><a href="#contacto">Contacto</a></nav>
</header>
<main id="world"></main>
<p class="cue" aria-hidden="true">seguí bajando<span class="cue-long">: cada pantalla muestra cómo está hecha</span><i></i></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="demo-data.js"></script>
<script>
'use strict'
const D = window.DATA
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const STATUS = { LIVE: 'En producción', WIP: 'En desarrollo', ARCHIVED: 'Archivado' }
gsap.registerPlugin(ScrollTrigger)

/* ── Contenido: cada escena tiene su cara de diseño y su cara de registro ── */
const shown = D.projects.filter(p => p.cover)
const wip = D.projects.filter(p => !p.cover)
const q = v => `<span class="q">"</span>${esc(v)}<span class="q">"</span>`
const field = (k, t, v) => `<div><dt>${k}<span class="t">${esc(t)}</span></dt><dd>${v == null ? '<span class="null">NULL</span>' : v}</dd></div>`
const json = m => m ? esc(JSON.stringify(m, null, 1).replace(/\n\s*/g, ' ')) : null

const scenes = []
scenes.push({
  id: 'inicio',
  design: `<div class="top"><span>${esc(D.about.role)}</span><span><i class="dot"></i>${esc(D.contact.availability.split('·')[0].trim())} · Río Negro, AR</span></div>
    <div class="side"><p>${esc(D.headline)}.</p></div>
    <div class="bottom"><h1 class="huge">Mateo<br>Sonzogni<span class="sq"></span></h1></div>`,
  record: `<div class="top"><span>document · <b>about + contact</b></span><span>updatedAt 2026-10-05</span></div>
    <dl class="fields">
      ${field('role', 'string', q(D.about.role))}
      ${field('headline', 'string', q(D.headline))}
      ${field('availability', 'string', q(D.contact.availability))}
      ${field('location', 'string', q(D.contact.location))}
      ${field('languages', 'string', q(D.about.languages))}
      ${field('work_modalities', 'string', q(D.about.work_modalities))}
      ${field('projects', 'relation → Project[]', D.projects.length + ' records')}
    </dl>
    <div class="bottom"><p class="r-big"><span class="k">name: </span>${q(D.about.name)}</p></div>`,
})
shown.forEach((p, i) => scenes.push({
  id: i === 0 ? 'obra' : 'obra-' + p.slug, tint: p.cover.tint,
  design: `<figure class="shot"><img src="${p.cover.src}" alt="${esc(p.cover.alt)}" loading="${i ? 'lazy' : 'eager'}"></figure><div class="shade"></div>
    <div class="top"><span>${esc(p.role)}</span><span><i class="dot ${p.status}"></i>${STATUS[p.status]} · ${p.year}</span></div>
    <div class="side soft"><p>${esc(p.summary)}</p><a class="open" href="demo.html#/obra/${p.slug}">Abrir el caso <span aria-hidden="true">↗</span></a></div>
    <div class="bottom"><h2 class="title">${esc(p.title)}</h2></div>`,
  record: `<div class="top"><span>record · <b>Project · ${p.slug}</b></span><span>status: ${p.status} · year: ${p.year}</span></div>
    <dl class="fields">
      ${field('org', 'relation → Org?', p.org ? esc(p.org) : null)}
      ${field('role', 'string', q(p.role))}
      ${field('techs', `relation → Tech[] (${p.techs.length})`, esc(p.techs.join(', ')))}
      ${field('metrics', 'json', json(p.metrics))}
      ${field('media', 'relation → Media[] (1)', `${esc(p.cover.src.replace('https://mateogs.tech', ''))}\n${p.cover.w}×${p.cover.h} · ${Math.round((p.cover.bytes ?? 0) / 1024)} KB · tint ${p.cover.tint}`)}
      ${field('url', 'string?', p.url ? q(p.url) : null)}
      ${field('repo', 'string?', p.repo ? q(p.repo) : null)}
    </dl>
    <div class="bottom"><p class="r-big"><span class="k">title: </span>${q(p.title)}</p><p class="r-lede">summary: "${esc(p.summary)}"</p></div>`,
}))
scenes.push({
  id: 'en-desarrollo',
  design: `<div class="top"><span>En desarrollo</span><span>${wip.length} obras sin portada todavía</span></div>
    <div class="bottom" style="flex-direction:column;align-items:flex-start;gap:2.5rem">${wip.map(p => `<div><h2 class="title" style="font-size:clamp(2.4rem,7vw,7.5rem)">${esc(p.title)}</h2><p class="side soft" style="position:static;margin-top:.8rem"><span style="color:var(--dim)">${esc(p.summary)}</span></p></div>`).join('')}</div>`,
  record: `<div class="top"><span>collection · <b>Project</b> · where status = WIP</span><span>${wip.length} records</span></div>
    <div class="bottom" style="flex-direction:column;align-items:flex-start;gap:2.5rem">${wip.map(p => `<div><p class="r-big" style="font-size:clamp(1.2rem,3.3vw,3.4rem)"><span class="k">title: </span>${q(p.title)}</p><p class="r-lede" style="text-align:left;margin-top:.8rem">media: NULL · techs: ${esc(p.techs.join(', '))}</p></div>`).join('')}</div>`,
})
const usedTechs = new Set(D.projects.flatMap(p => p.techs))
const stack = [...D.stack].sort((a, b) => a.since - b.since || a.name.localeCompare(b.name))
scenes.push({
  id: 'stack',
  design: `<div class="top"><span>Stack</span><span>en blanco, lo que está en una obra publicada</span></div>
    <p class="cloud">${stack.map(t => `<span class="${usedTechs.has(t.name) ? 'used' : ''}">${esc(t.name)}</span>`).join('<i>/</i>')}</p>`,
  record: `<div class="top"><span>collection · <b>Tech</b></span><span>${stack.length} records · order by since</span></div>
    <div class="techs">${stack.map(t => `<div><span>${esc(t.name)}</span><span class="t">${t.category}</span><span>${t.since}</span><span class="t n">${t.projects.length}</span></div>`).join('')}</div>`,
})
scenes.push({
  id: 'contacto', last: true,
  design: `<div class="top"><span>Contacto</span><span>${esc(D.contact.preferred_contact)}</span></div>
    <div class="bottom"><div><p style="color:var(--dim);margin-bottom:1rem">Escribime</p><a class="mail" href="mailto:${esc(D.contact.email)}">${esc(D.contact.email)}</a></div><div class="links"><a href="${D.contact.github}" target="_blank" rel="noopener">GitHub</a><a href="${D.contact.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a href="https://mateogs.tech/cv/CV-ES-Mateo-Sonzogni-ATS.pdf" target="_blank" rel="noopener">CV</a></div></div>`,
  record: '',
})

const world = $('#world')
if (reduce) world.classList.add('static')
world.innerHTML = scenes.map(s => `<section class="scene" id="${s.id}"${s.tint ? ` style="--tint:${s.tint}"` : ''}>
  <div class="face design">${s.design}</div>
  ${s.record ? `<div class="face record" aria-hidden="true" inert>${s.record}</div>
  <div class="seam" aria-hidden="true"><span class="lbl l">diseño</span><span class="knot"></span><span class="lbl r">datos</span></div>` : ''}
</section>`).join('')

/* ── El scroll mueve la costura ─────────────────────────────────────────── */
let lenis = null
if (!reduce && window.Lenis) {
  lenis = new Lenis({ lerp: 0.1 })
  gsap.ticker.add(t => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0)
  lenis.on('scroll', ScrollTrigger.update)
}
$$('.hud a').forEach(a => a.addEventListener('click', e => {
  if (!lenis) return
  e.preventDefault()
  // Ir a una escena es ir a su comienzo, todavía en diseño
  lenis.scrollTo(a.getAttribute('href'), { duration: 1.6 })
}))

if (!reduce) {
  $$('.scene').forEach(scene => {
    const record = $('.face.record', scene), seam = $('.seam', scene), shot = $('.shot', scene)
    if (!record) return
    // Ritmo de cada escena: un respiro en diseño, la línea la cruza, un respiro en registro
    const tl = gsap.timeline({ defaults: { ease: 'none' } })
      .to({}, { duration: 0.18 })
      .fromTo(record, { clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0%)', duration: 1 })
      .fromTo(seam, { left: '100%' }, { left: '0%', duration: 1 }, '<')
      .to({}, { duration: 0.32 })
    if (shot) tl.fromTo(shot, { scale: 1 }, { scale: 1.08, duration: 1 }, 0.18)
    ScrollTrigger.create({ trigger: scene, start: 'top top', end: '+=140%', pin: true, scrub: 0.6, animation: tl })
  })
  // Los títulos de cada escena suben desde su máscara cuando la escena entra
  $$('.design .title, .design .huge, .design .mail').forEach((el, i) => {
    gsap.from(el, { yPercent: 22, opacity: 0, duration: 1.1, ease: 'expo.out', scrollTrigger: i === 0 ? null : { trigger: el.closest('.scene'), start: 'top 70%' } })
  })
  const cue = $('.cue')
  ScrollTrigger.create({ start: 40, onEnter: () => gsap.to(cue, { opacity: 0, duration: 0.5 }), onLeaveBack: () => gsap.to(cue, { opacity: 1, duration: 0.5 }) })
} else $('.cue').hidden = true
</script>
</body>
</html>
