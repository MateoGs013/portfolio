# ==============================================================================
# RENDER BLUEPRINT (render.yaml)
# Infraestructura como código para deploy automático en Render
# ==============================================================================
services:
  # 1. Servicio Backend: API REST Express + Prisma + Admin Console
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm build:api
    startCommand: pnpm start:api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_VERSION
        value: "22"

  # 2. Servicio Frontend: Nuxt 4 (SSR)
  - type: web
    name: portfolio-web
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NUXT_PUBLIC_API_BASE
        # Se reemplaza por la URL de la API una vez generada (ej: https://portfolio-api.onrender.com/api)
        sync: false
      - key: NODE_VERSION
        value: "22"

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
    ipAllowList: [] # Permite conexiones internas y desde la API
