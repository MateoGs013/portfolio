<style>
@font-face { font-family: 'General Sans'; font-weight: 200 700; font-display: swap; src: url('/app/assets/fonts/GeneralSans-Variable.woff2') format('woff2-variations'); }
@font-face { font-family: 'Martian Mono'; font-weight: 100 800; font-display: swap; src: url('/node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wght-normal.woff2') format('woff2-variations'); }

:root {
  --bg: #0b0b0c; --panel: #111113; --surface: #161618; --surface-2: #1c1c1f;
  --rule: rgba(255,255,255,.08); --rule-strong: rgba(255,255,255,.14);
  --ink: #ededee; --dim: #a1a1a9; --faint: #83838c;
  --sig: #ff3e00; --sig-text: #ff3e00; --ok: #3ecf6e; --wip: #e5a00d; --danger: #f0524f;
  --e: cubic-bezier(.16,1,.3,1);
  --sans: 'General Sans', system-ui, sans-serif; --mono: 'Martian Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 420 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sig-text); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: -.01em; }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.t-meta { font-size: 12px; } .t-label { font-size: 13px; color: var(--dim); } .t-row { font-size: 15px; font-weight: 520; }
.t-title { font-size: 20px; font-weight: 560; letter-spacing: -.02em; } .t-figure { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 1px 5px; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.wip { background: var(--wip); } .dot.sig { background: var(--sig); } .dot.danger { background: var(--danger); }

/* Shell */
.app { display: grid; grid-template-columns: 240px minmax(300px, 340px) 1fr; height: 100vh; }
.app.wide { grid-template-columns: 240px 1fr; }
.app.wide .explorer { display: none; }
.nav { background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 16px 10px 12px; position: relative; }

.brand span { font-size: 12px; color: var(--faint); }
.goto { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; margin-bottom: 14px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--surface); color: var(--faint); cursor: pointer; transition: border-color .12s, color .12s; }
.goto:hover { color: var(--dim); border-color: rgba(255,255,255,.22); }
.goto kbd { margin-left: auto; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav li a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; text-decoration: none; color: var(--dim); transition: color .12s, background-color .12s; position: relative; z-index: 1; }
.nav li a:hover { color: var(--ink); background: var(--surface); }
.nav li a[aria-current] { color: var(--ink); }
.nav li a .n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav .group { margin-top: 18px; }
.nav .group > span { display: block; padding: 0 10px 6px; font-size: 12px; color: var(--faint); }
.nav-ind { position: absolute; top: 0; left: 10px; right: 10px; height: 32px; border-radius: 6px; background: var(--surface-2); box-shadow: inset 2px 0 0 var(--sig); transition: transform .3s var(--e), opacity .2s; pointer-events: none; z-index: 0; opacity: 0; }
.nav-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--rule); display: grid; gap: 6px; font-size: 12px; color: var(--faint); }
.nav-foot .row { display: flex; align-items: center; gap: 8px; }
.nav-foot a { text-decoration: none; color: var(--dim); } .nav-foot a:hover { color: var(--ink); }

/* Explorador */
.explorer { background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.ex-head { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
.ex-head .t-title { font-size: 17px; }
.ex-head .count { color: var(--faint); font-variant-numeric: tabular-nums; }
.ex-head .btn { margin-left: auto; }
.ex-search { margin: 0 16px 10px; }
.seg { display: flex; gap: 2px; margin: 0 16px 10px; padding: 2px; border-radius: 7px; background: var(--surface); width: fit-content; }
.seg button { white-space: nowrap; border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 5px; color: var(--faint); cursor: pointer; font-size: 13px; transition: color .12s, background-color .12s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--surface-2); color: var(--ink); }
.list { overflow: auto; flex: 1; border-top: 1px solid var(--rule); }
.item { display: block; padding: 11px 16px 12px; border-bottom: 1px solid var(--rule); text-decoration: none; cursor: pointer; transition: background-color .12s; }
.item:hover { background: var(--surface); }
.item[aria-current] { background: var(--surface-2); }
.item .t-row { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 13px; color: var(--faint); }
.item .meta .r { margin-left: auto; font-variant-numeric: tabular-nums; }

/* Controles */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--surface-2); border-color: rgba(255,255,255,.22); }
.btn.primary { background: var(--sig); border-color: var(--sig); color: #0b0b0c; font-weight: 560; }
.btn.primary:hover { background: #ff5520; }
.btn.primary kbd { color: rgba(11,11,12,.7); border-color: rgba(11,11,12,.3); }
.btn.ghost { background: none; border-color: transparent; color: var(--dim); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); }
.btn.danger { color: var(--danger); background: none; border-color: transparent; }
.btn.danger:hover { background: rgba(240,82,79,.1); }
.btn.lg { height: 36px; padding: 0 16px; }
.input, .textarea, .select { width: 100%; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--surface); outline: none; transition: border-color .12s, background-color .12s; }
.input:hover, .textarea:hover { border-color: rgba(255,255,255,.22); }
.input:focus, .textarea:focus { border-color: var(--dim); background: var(--surface-2); }
.textarea { height: auto; min-height: 84px; padding: 9px 10px; resize: vertical; font-size: 15px; line-height: 1.6; }
.input.mono { font-size: 12px; }
.field { display: grid; gap: 6px; }
.field > .lab { display: flex; align-items: baseline; gap: 10px; }
.field > .lab label { font-size: 13px; color: var(--dim); }
.field > .lab .aux { margin-left: auto; font-size: 12px; color: var(--faint); }
.field .help { font-size: 12px; color: var(--faint); }
.field.same .input, .field.same .textarea { color: var(--faint); }
.miss { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--wip); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--rule-strong); font-size: 13px; color: var(--ink); background: var(--surface); }
.chip button { border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0; line-height: 1; }
.chip button:hover { color: var(--ink); }
.chip.add { color: var(--faint); border-style: dashed; cursor: pointer; background: none; }
.chip.add:hover { color: var(--ink); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; border: 0; background: none; padding: 0; color: var(--ink); }
.switch .track { width: 30px; height: 18px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--rule-strong); position: relative; transition: background-color .2s; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: transform .2s var(--e), background-color .2s; }
.switch[aria-checked=true] .track { background: rgba(255,62,0,.25); border-color: rgba(255,62,0,.5); }
.switch[aria-checked=true] .track::after { transform: translateX(12px); background: var(--sig); }

/* Editor */
.editor { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.ed-head { padding: 18px 32px 0; border-bottom: 1px solid var(--rule); }
.crumb { font-size: 13px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.crumb a { text-decoration: none; color: var(--faint); } .crumb a:hover { color: var(--ink); }
.ed-top { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.ed-top h1 { margin: 0; }
.ed-top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pub { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--rule-strong); font-size: 13px; cursor: pointer; background: none; color: var(--ink); }
.pub:hover { background: var(--surface); }
.pub .faint { font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 22px; margin-top: 16px; position: relative; }
.tabs a { padding: 8px 0 12px; text-decoration: none; color: var(--faint); font-size: 14px; transition: color .12s; display: inline-flex; gap: 6px; align-items: baseline; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-selected=true] { color: var(--ink); }
.tabs a .n { font-size: 12px; color: var(--faint); }
.tab-ind { position: absolute; bottom: -1px; height: 2px; background: var(--sig); transition: transform .3s var(--e), width .3s var(--e); left: 0; }
.ed-body { flex: 1; overflow: auto; padding: 28px 32px 48px; }
.form { max-width: 760px; display: grid; gap: 22px; }
.form h2 { font-size: 15px; font-weight: 560; margin: 14px 0 -6px; }
.form h2:first-child { margin-top: 0; }
.rule { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
.ed-foot { display: flex; align-items: center; gap: 10px; padding: 12px 32px; border-top: 1px solid var(--rule); background: var(--bg); }
.save-state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); }
.ed-foot .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.lang { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--surface); }
.lang button { border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 5px; color: var(--faint); cursor: pointer; font-size: 13px; }
.lang button[aria-pressed=true] { background: var(--surface-2); color: var(--ink); }

/* Tablas y tarjetas */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-weight: 420; font-size: 13px; color: var(--faint); padding: 0 10px 8px 0; border-bottom: 1px solid var(--rule); }
.table td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.table td .input { height: 30px; background: transparent; border-color: transparent; }
.table td .input:hover { border-color: var(--rule-strong); }
.table td .input:focus { background: var(--surface-2); border-color: var(--dim); }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.mcard { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); transition: border-color .12s; }
.mcard:hover { border-color: var(--rule-strong); }
.mcard .thumb { aspect-ratio: 16/10; background: var(--surface); position: relative; overflow: hidden; }
.mcard .thumb.mobile { aspect-ratio: 16/10; display: grid; place-items: center; }
.mcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 0; }
.mcard .thumb.mobile img { width: auto; height: 100%; object-fit: contain; }
.mcard .thumb .kind { position: absolute; left: 8px; bottom: 8px; font-size: 12px; padding: 2px 7px; border-radius: 4px; background: rgba(11,11,12,.75); color: var(--ink); }
.mcard .info { padding: 10px 12px 12px; display: grid; gap: 4px; }
.mcard .info .top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.mcard .info .top .sw { width: 12px; height: 12px; border-radius: 3px; margin-left: auto; border: 1px solid var(--rule-strong); }
.mcard .info p { margin: 0; font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.drop { border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 22px; text-align: center; color: var(--faint); font-size: 13px; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.step .num { font-variant-numeric: tabular-nums; color: var(--faint); padding-top: 6px; }

/* Inicio */
.home { padding: 40px 48px; overflow: auto; height: 100vh; }
.home-in { max-width: 920px; }
.home .summary { margin-top: 10px; font-size: 15px; color: var(--dim); }
.home .summary b { color: var(--ink); font-weight: 520; }
.home .actions { display: flex; gap: 8px; margin-top: 20px; }
.home h2 { font-size: 15px; font-weight: 560; margin: 44px 0 4px; display: flex; gap: 10px; align-items: baseline; }
.home h2 span { color: var(--faint); font-weight: 420; font-size: 13px; }
.pending { list-style: none; padding: 0; margin: 0; }
.pending a { display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); text-decoration: none; transition: background-color .12s, padding .2s var(--e); }
.pending a:hover { background: linear-gradient(90deg, var(--surface), transparent); padding-left: 8px; }
.pending .what { font-size: 15px; }
.pending .ctx { display: block; font-size: 13px; color: var(--faint); margin-top: 2px; }
.pending .go { color: var(--faint); font-size: 13px; }
.status-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 40px; }
.status-row div { padding: 16px 18px 16px 0; }
.status-row div + div { padding-left: 18px; border-left: 1px solid var(--rule); }
.status-row .t-label { display: block; margin-bottom: 6px; }

/* CV A4 */
.sheet-wrap { background: #1a1a1d; border-radius: 10px; padding: 28px; display: grid; place-items: start center; overflow: auto; }
.sheet-box { position: relative; }
.sheet { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 794px; min-height: 1123px; background: #fff; color: #000; padding: 40px 45px; font-family: 'Times New Roman', Times, Georgia, serif; font-size: 12.4px; line-height: 1.32; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.sheet h3 { text-align: center; font-size: 26px; margin: 0; font-weight: 700; }

.sheet .entry { margin-bottom: 6px; }
.sheet .entry .top { display: flex; justify-content: space-between; font-weight: 700; }
.sheet .entry .sub { display: flex; justify-content: space-between; font-style: italic; }
.sheet ul { margin: 2px 0 0; padding-left: 18px; }
.sheet .hl { background: rgba(255,62,0,.18); outline: 1px solid rgba(255,62,0,.5); }

/* Vacantes */
.verdict { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
.stage-grid { display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
.side { border-left: 1px solid var(--rule); padding-left: 24px; display: grid; gap: 14px; position: sticky; top: 0; }

.prop p { margin: 0; font-size: 14px; line-height: 1.55; }
.src { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.points { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.points li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: baseline; }

/* Paleta, aviso */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: start center; padding-top: 14vh; z-index: 50; opacity: 0; transition: opacity .2s; }
.scrim[data-open] { opacity: 1; }
.palette { width: min(620px, 92vw); background: var(--surface-2); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; transform: translateY(6px); transition: transform .2s var(--e); }
.scrim[data-open] .palette { transform: none; }
.palette input { width: 100%; height: 50px; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 0 18px; font-size: 16px; outline: none; }
.pal-list { max-height: 380px; overflow: auto; padding: 6px; position: relative; }

.pal-hi { position: absolute; left: 6px; right: 6px; height: 36px; border-radius: 6px; background: rgba(255,255,255,.06); box-shadow: inset 2px 0 0 var(--sig); transition: transform .3s cubic-bezier(.33,1,.68,1); z-index: 0; }
.pal-foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--faint); }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 8px); background: var(--surface-2); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s var(--e); z-index: 60; pointer-events: none; }
.toast[data-on] { opacity: 1; transform: translate(-50%, 0); }
.demo-note { position: fixed; right: 14px; bottom: 12px; font-size: 12px; color: var(--faint); z-index: 40; }


/* ── Dirección 2: más carácter del sitio, una cosa por pantalla ── */
.app, .app.wide { grid-template-columns: 220px 1fr; }

.nav { background: var(--bg); }
