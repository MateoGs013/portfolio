<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOS MUNDOS — demo</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,500,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Martian+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{-webkit-font-smoothing:antialiased;font-size:13px;
  background:#0b0906;transition:background 900ms cubic-bezier(.72,0,.14,1)}
body[data-w="datos"]{background:#e2e2de}
body[data-w="diseno"]{background:#0e0b07}

/* ===================== SHELL ===================== */
.shell{height:100%;display:flex;flex-direction:column;position:relative}
.world{position:absolute;inset:0;display:none;flex-direction:column}
.world.on{display:flex}

/* ===================== SWITCH ===================== */
#sw{position:fixed;z-index:60;right:clamp(14px,2.4vw,30px);top:clamp(14px,2.4vw,26px);
  display:flex;border:1px solid;cursor:pointer;overflow:hidden;
  font-family:'General Sans',Arial,sans-serif}
#sw span{padding:9px 15px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  transition:all 620ms cubic-bezier(.72,0,.14,1)}
body[data-w="datos"] #sw{border-color:#0d0d0c}
body[data-w="datos"] #sw .a{background:#0d0d0c;color:#e2e2de}
body[data-w="datos"] #sw .b{color:#75746e}
body[data-w="diseno"] #sw{border-color:#4a4032}
body[data-w="diseno"] #sw .a{color:#7d7160}
body[data-w="diseno"] #sw .b{background:#c8451c;color:#fff}

#flyer{position:fixed;z-index:90;pointer-events:none;white-space:nowrap;opacity:0}
#curtain{position:fixed;inset:0;z-index:70;pointer-events:none;transform:scaleY(0);
  transform-origin:bottom}

/* ===================== MUNDO DATOS ===================== */
#datos{--paper:#e2e2de;--ink:#0d0d0c;--rule:#b3b2ac;--dim:#75746e;--faint:#9b9a93;--sig:#2020cc;
  --frame:clamp(16px,2.4vw,34px);--col:224px;--pane:376px;
  color:var(--ink);font-family:'Martian Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.45}
#datos .bar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex:none;
  padding:0 var(--frame);height:44px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
#datos .bar.top{border-bottom:1px solid var(--rule);padding-right:150px}
#datos .bar.bot{border-top:1px solid var(--rule);color:var(--dim);height:38px}
#datos #dpath{display:flex;align-items:center;text-transform:none;letter-spacing:0;
  overflow:hidden;white-space:nowrap}
#datos #dpath button{background:none;border:none;font:inherit;font-size:10px;color:var(--sig);cursor:pointer;padding:0}
#datos #dpath button:hover{text-decoration:underline}
#datos #dpath .sep{color:var(--faint);padding:0 6px}
#datos #dpath .here{color:var(--ink)}
#datos .exp{flex:1;padding:var(--frame) 0 var(--frame) var(--frame);
  perspective:1500px;perspective-origin:72% 46%;overflow:hidden}
#datos .track{display:flex;height:100%;transform-style:preserve-3d;
  transition:transform 660ms cubic-bezier(.72,0,.14,1)}
#datos .col{flex:none;width:var(--col);height:100%;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;background:var(--paper);
  transition:transform 660ms cubic-bezier(.72,0,.14,1),opacity 660ms,filter 660ms}
#datos .col.pane{width:var(--pane);border-right:none;padding-right:var(--frame)}
#datos .colhead{flex:none;font-size:9px;letter-spacing:.2em;color:var(--dim);
  padding:0 15px 9px 0;border-bottom:1px solid var(--ink);margin-right:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#datos .col.pane .colhead{margin-right:0}
#datos .collist{flex:1;overflow-y:auto;padding-right:15px}
#datos .col.pane .collist{padding-right:0}
#datos .item{display:grid;grid-template-columns:1fr auto 12px;gap:10px;align-items:baseline;width:100%;
  background:none;border:none;border-bottom:1px solid var(--rule);font:inherit;text-align:left;
  padding:10px 0 10px 9px;cursor:pointer;color:inherit}
#datos .item:hover{background:#d8d8d3}
#datos .item[aria-current="true"]{background:var(--ink);color:var(--paper)}
#datos .item[aria-current="true"] .imeta,#datos .item[aria-current="true"] .chev{color:#a5a59f}
#datos .item.dim[aria-current="true"]{background:#c6c6c1;color:var(--ink)}
#datos .iname{font-family:'General Sans',sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#datos .imeta{font-size:9px;letter-spacing:.1em;color:var(--dim)}
#datos .chev{font-size:12px;color:var(--faint);justify-self:end}
#datos .pane h2{font-family:'General Sans',sans-serif;font-weight:700;font-size:28px;
  letter-spacing:-.035em;line-height:.95;margin:12px 0 3px}
#datos .ptype{font-size:9px;letter-spacing:.2em;color:var(--dim);margin-bottom:16px}
#datos .field{display:grid;grid-template-columns:110px 70px 1fr;gap:12px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule)}
#datos .field.wide{grid-template-columns:1fr;gap:5px;padding-bottom:13px}
#datos .fname{font-size:9px;letter-spacing:.16em;color:var(--dim)}
#datos .ftype{font-size:9px;color:var(--faint)}
#datos .fval{font-family:'General Sans',sans-serif;font-size:13.5px;line-height:1.5;word-break:break-word}
#datos .field.wide .fval{font-size:14.5px;line-height:1.6;max-width:52ch}
#datos .nul{color:var(--faint);font-family:'Martian Mono',monospace;font-size:11px}
#datos kbd{border:1px solid var(--rule);padding:1px 5px;font:inherit;font-size:9px}
#datos .keys{display:flex;gap:13px;flex-wrap:wrap}

/* ===================== MUNDO DISEÑO ===================== */
#diseno{--bg:#0e0b07;--panel:#15100a;--edge:#2c251a;--paper:#efe4cc;--ink:#211c15;
  --bone:#ebe1cb;--dim:#8b7f6b;--faint:#584f40;--ember:#c8451c;--gold:#b08a34;
  color:var(--bone);font-family:'General Sans','Helvetica Neue',Arial,sans-serif}
#diseno .nav{flex:none;display:flex;border-bottom:1px solid var(--edge);padding-right:150px}
#diseno .nb{flex:1;background:none;border:none;border-right:1px solid var(--edge);color:var(--faint);
  font:inherit;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:14px 6px;
  cursor:pointer;transition:color .35s;position:relative}
#diseno .nb:hover,#diseno .nb[aria-current="true"]{color:var(--bone)}
#diseno .nb i{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ember);
  transform:scaleX(0);transform-origin:left;display:block}
#diseno .body{flex:1;position:relative;overflow:hidden}
#diseno .sec{position:absolute;inset:0;display:none;flex-direction:column;
  padding:clamp(16px,2.8vw,40px);overflow:auto}
#diseno .sec.on{display:flex}
#diseno .k{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);flex:none}

/* proyectos */
#diseno .pv{flex:1;display:grid;grid-template-columns:1.3fr .7fr;
  gap:clamp(16px,2.8vw,44px);min-height:0;align-items:center}
#diseno .stage{position:relative;height:100%;min-height:0;display:flex;align-items:center;
  justify-content:center;perspective:1300px}
#diseno .hero{position:relative;width:100%;max-height:100%;aspect-ratio:4/3;
  box-shadow:0 36px 80px -28px rgba(0,0,0,.95),0 0 0 1px rgba(255,240,210,.07);
  transform-style:preserve-3d;will-change:transform}
#diseno .hero svg{display:block;width:100%;height:100%}
#diseno .glow{position:absolute;inset:-14%;pointer-events:none;z-index:-1;
  background:radial-gradient(closest-side circle,rgba(255,214,150,.15),transparent 72%)}
#diseno .info{display:flex;flex-direction:column;gap:13px;min-width:0}
#diseno .mask{overflow:hidden;display:block}
#diseno h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(30px,4.6vw,60px);line-height:.9;
  letter-spacing:-.035em;color:var(--paper);
  font-variation-settings:'opsz' calc(20+var(--fx,1)*118),'wght' calc(300+var(--fx,1)*430),
   'SOFT' calc(var(--fx,1)*52),'WONK' 1}
#diseno .lede{font-family:'Fraunces',Georgia,serif;font-size:clamp(12px,1.35vw,15px);line-height:1.55;
  color:#b6aa93;max-width:34ch;font-variation-settings:'opsz' 15,'wght' 380,'SOFT' 40}
#diseno .meta{border-top:1px solid var(--edge);margin-top:3px}
#diseno .meta .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid var(--edge)}
#diseno .meta b{font-weight:400;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
#diseno .meta span{font-family:'Fraunces',Georgia,serif;font-size:13.5px;
  font-variation-settings:'opsz' 16,'wght' 480}
#diseno .build{flex:none;display:flex;align-items:center;gap:clamp(10px,1.8vw,22px);
  padding:10px 0;border-top:1px solid var(--edge);margin-top:10px}
#diseno .lb{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);flex:none}
#diseno .scrub{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:#2c251a;
  outline:none;cursor:pointer;min-width:50px}
#diseno .scrub::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  background:var(--ember);border-radius:0}
#diseno .scrub::-moz-range-thumb{width:11px;height:11px;background:var(--ember);border:none;border-radius:0}
#diseno .stg{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:4px 8px;border:1px solid var(--edge);transition:all .3s}
#diseno .stg.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
#diseno .strip{flex:none;height:clamp(66px,9vh,88px);display:flex;gap:1px;background:var(--edge);
  overflow-x:auto;margin-top:10px}
#diseno .th{flex:none;width:clamp(88px,11vw,126px);background:var(--panel);border:none;
  cursor:pointer;padding:8px;position:relative;overflow:hidden}
#diseno .th svg{width:100%;height:100%;display:block;opacity:.45;transition:opacity .4s}
#diseno .th:hover svg{opacity:.8}
#diseno .th[aria-current="true"] svg{opacity:1}
#diseno .th .bar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--ember);
  transform:scaleX(0);transform-origin:left}
#diseno .th .nm{position:absolute;left:8px;bottom:5px;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
#diseno .th[aria-current="true"] .nm{color:var(--gold)}

/* timeline */
#diseno .axis{position:relative;height:24px;flex:none;border-bottom:1px solid var(--edge);margin-top:18px}
#diseno .tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:9px;
  letter-spacing:.14em;color:var(--faint);padding-bottom:6px}
#diseno .tick::after{content:'';position:absolute;left:50%;bottom:0;width:1px;height:5px;background:var(--edge)}
#diseno .bands{position:relative;flex:none;display:flex;flex-direction:column;gap:8px;padding-top:8px}
#diseno .band{position:relative;height:48px;background:var(--panel);border:1px solid var(--edge);
  transform-origin:left center;display:flex;align-items:center;padding:0 15px;overflow:hidden;
  cursor:pointer;transition:border-color .4s,opacity .4s}
#diseno .band:hover{border-color:var(--gold)}
#diseno .band .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,rgba(200,69,28,.3),rgba(176,138,52,.1))}
#diseno .band .bn{position:relative;font-family:'Fraunces',Georgia,serif;font-size:16px;
  font-variation-settings:'opsz' 20,'wght' 520,'WONK' 1}
#diseno .band .br{position:relative;margin-left:auto;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
#diseno .band.off{opacity:.32}
#diseno .play{position:absolute;top:0;bottom:0;width:1px;background:var(--ember);z-index:5}
#diseno .play::before{content:'';position:absolute;left:-4px;top:-4px;width:9px;height:9px;background:var(--ember)}
#diseno .det{flex:none;border-top:1px solid var(--edge);padding-top:13px;margin-top:14px;min-height:66px}
#diseno .det h3{font-family:'Fraunces',Georgia,serif;font-size:20px;
  font-variation-settings:'opsz' 26,'wght' 540,'WONK' 1}
#diseno .det p{color:var(--dim);font-size:12px;line-height:1.55;max-width:54ch;margin-top:5px}

/* muestrario */
#diseno .fan{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:230px}
#diseno .chip{position:absolute;width:clamp(102px,13vw,146px);aspect-ratio:5/7;cursor:pointer;
  transform-origin:50% 118%;will-change:transform;background:var(--paper);
  box-shadow:0 16px 36px -14px rgba(0,0,0,.85);padding:11px;
  display:flex;flex-direction:column;justify-content:space-between}
#diseno .chip .sw{width:100%;flex:1;margin-bottom:9px}
#diseno .chip .cn{font-family:'Fraunces',Georgia,serif;color:var(--ink);font-size:14px;line-height:1;
  font-variation-settings:'opsz' 18,'wght' 580,'WONK' 1}
#diseno .chip .cy{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8a7c62;margin-top:3px}

/* specimen */
#diseno .sname{font-family:'Fraunces',Georgia,serif;color:var(--paper);line-height:.84;
  letter-spacing:-.045em;font-size:clamp(46px,11vw,140px);flex:none;
  font-variation-settings:'opsz' var(--o,120),'wght' var(--w,700),'SOFT' var(--s,20),'WONK' var(--k,1)}
#diseno .axes{display:flex;gap:clamp(12px,2vw,30px);flex-wrap:wrap;flex:none;
  border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:13px 0;margin:16px 0}
#diseno .ax{flex:1;min-width:110px}
#diseno .ax label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint);margin-bottom:6px}
#diseno .ax label b{font-weight:400;color:var(--gold)}
#diseno .ax input{width:100%;-webkit-appearance:none;appearance:none;height:2px;background:#2c251a;
  outline:none;cursor:pointer}
#diseno .ax input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
  background:var(--bone);border-radius:0}
#diseno .ax input::-moz-range-thumb{width:10px;height:10px;background:var(--bone);border:none;border-radius:0}
#diseno .sbody{display:grid;grid-template-columns:1.4fr .6fr;gap:clamp(16px,2.8vw,40px)}
#diseno .sbody p{font-family:'Fraunces',Georgia,serif;font-size:clamp(13px,1.5vw,18px);line-height:1.5;
  color:#c2b69d;max-width:44ch;font-variation-settings:'opsz' 18,'wght' 420,'SOFT' var(--s,20)}
#diseno .sdata div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--edge);font-size:10px}
#diseno .sdata b{font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#diseno .sdata span{color:var(--dim)}

/* impresión */
#diseno .print{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
#diseno .ink{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,5.6vw,72px);
  letter-spacing:-.035em;line-height:.95;color:var(--paper);overflow:hidden;display:block;
  font-variation-settings:'opsz' 100,'wght' 620,'SOFT' 24,'WONK' 1}
#diseno .stamps{display:flex;gap:11px;flex-wrap:wrap}
#diseno .stamp{border:1px dashed var(--faint);background:none;color:var(--dim);font:inherit;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:10px 16px;cursor:pointer;transition:all .4s}
#diseno .stamp:hover{border-color:var(--ember);color:var(--paper);border-style:solid}
#diseno .pnote{font-size:11px;color:var(--faint);max-width:44ch;line-height:1.6}

/* ===================== UMBRAL ===================== */
#umbral{position:fixed;inset:0;z-index:80;display:flex;background:#0b0906}
#umbral .half{flex:1;border:none;font:inherit;text-align:left;cursor:pointer;color:#ebe1cb;
  padding:clamp(20px,3.4vw,46px);display:flex;flex-direction:column;justify-content:space-between;
  background:#0b0906;transition:background .4s}
#umbral .half+.half{border-left:1px solid #2a241c}
#umbral .half:hover{background:#141009}
#umbral .half .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#5f574a}
#umbral .half h2{font-size:clamp(28px,5vw,58px);line-height:.9;letter-spacing:-.035em}
#umbral .half p{font-size:12px;color:#8b7f6b;max-width:32ch;line-height:1.6;margin-top:13px}
#umbral .a h2{font-family:'General Sans',sans-serif;font-weight:700}
#umbral .b h2{font-family:'Fraunces',Georgia,serif;font-variation-settings:'opsz' 90,'wght' 620,'WONK' 1}

:focus-visible{outline:2px solid #2020cc;outline-offset:2px}
body[data-w="diseno"] :focus-visible{outline-color:#c8451c}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
@media (max-width:900px){
  #datos .exp{perspective:none;padding:var(--frame)}
  #datos .track{transform:none!important}
  #datos .col{display:none;width:100%!important;transform:none!important;opacity:1!important;
    filter:none!important;border-right:none;height:auto}
  #datos .col.live,#datos .col.pane{display:flex}
  #datos .track{flex-direction:column;overflow-y:auto}
  #datos .keys{display:none}
  #diseno .pv{grid-template-columns:1fr;gap:14px;overflow:auto}
  #diseno .stage{height:auto} #diseno .hero{max-height:34vh}
  #diseno .sbody{grid-template-columns:1fr}
  #umbral{flex-direction:column}
  #umbral .half+.half{border-left:none;border-top:1px solid #2a241c}
}
</style>
</head>
<body data-w="datos">

<div class="shell">

  <!-- ============ MUNDO DATOS ============ -->
  <div class="world on" id="datos">
    <div class="bar top"><nav id="dpath" aria-label="Ruta"></nav></div>
    <div class="exp" id="dexp"><div class="track" id="dtrack"></div></div>
    <div class="bar bot">
      <span class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> mover</span><span><kbd>→</kbd> entrar</span>
      <span><kbd>←</kbd> volver</span></span>
      <span>tinta sobre papel · sin animación gratuita</span>
    </div>
  </div>

  <!-- ============ MUNDO DISEÑO ============ -->
  <div class="world" id="diseno">
    <div class="nav" id="dnav"></div>
    <div class="body" id="dbody"></div>
  </div>

</div>

<div id="sw"><span class="a">datos</span><span class="b">diseño</span></div>
<div id="flyer"></div><div id="curtain"></div>

<div id="umbral">
  <button class="half a" data-w="datos">
    <span class="tag">01 · consultar</span>
    <span><h2>DATOS</h2><p>Explorador de columnas. Denso, frío, navegable entero con el teclado.</p></span>
  </button>
  <button class="half b" data-w="diseno">
    <span class="tag">02 · mirar</span>
    <span><h2>DISEÑO</h2><p>Cada sección con su propia forma. Las piezas se construyen solas.</p></span>
  </button>
</div>

<script>
(function(){
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* =========================================================
   UN SOLO MODELO DE CONTENIDO. Los dos mundos leen de acá.
   ========================================================= */
var DB={
 projects:{label:'projects',kind:'collection',meta:function(r){return r.year;},records:[
  {slug:'kalei',year:2025,role:'Lead',client:'Estudio Norte',stack:'nuxt · webgl',m:0,
   lede:'Un índice que mezclaba tres taxonomías, reducido a una sola superficie navegable.',sub:['process','gallery']},
  {slug:'meridiano',year:2024,role:'Dev',client:'Banco Sur',stack:'next · three',m:1,
   lede:'Series temporales para un equipo repartido en dos husos horarios.',sub:['process']},
  {slug:'atlas',year:2024,role:'Lead',client:'Fundación Atlas',stack:'vue · gsap',m:2,
   lede:'Archivo público pensado para durar veinte años sin mantenimiento.',sub:['process','gallery']},
  {slug:'nocturno',year:2023,role:'Dev',client:'Sello Nocturno',stack:'nuxt · canvas',m:3,
   lede:'Catálogo de jazz donde el disco suena antes de que cargue la tapa.',sub:['process']},
  {slug:'ferro',year:2023,role:'Dev',client:'Ferro Analytics',stack:'react · d3',m:4,
   lede:'Once planillas sueltas reemplazadas por una sola fuente de verdad.',sub:['process']}
 ]},
 experience:{label:'experience',kind:'collection',meta:function(r){return r.from;},records:[
  {slug:'pegasuz',company:'Pegasuz',role:'Frontend Lead',from:2024,to:2026.6,stack:'vue · nuxt · prisma',
   lede:'Arquitectura frontend multi-tenant y un sistema de diseño compartido entre productos.',sub:[]},

function children(p){

      meta:String(c.meta(r)),kids:!!(r.sub&&r.sub.length)};}); }
  if(p.length===2){ var r=recOf(p[0],p[1]);
    return (r&&r.sub)?r.sub.map(function(s){return {key:s,label:s,meta:'',kids:false};}):[]; }
  return [];
}
function detail(p){
  if(p.length===0) return {t:'SCHEMA',ty:'root',rows:[['collections','int',String(ORDER.length),0],
    ['note','text','Cada carpeta responde una pregunta distinta.',1]]};
  var c=DB[p[0]]; if(!c) return null;
  if(p.length===1){ if(c.kind==='document') return {t:c.label.toUpperCase(),ty:'document',rows:c.doc};
    return {t:c.label.toUpperCase(),ty:'collection',rows:[['kind','string','collection',0],
      ['records','int',String(c.records.length),0]]}; }
  if(p.length===2){ var r=recOf(p[0],p[1]); if(!r) return null; var rows=[];
    for(var key in r){ if(key==='sub'||key==='m'||key==='c') continue;
      var t=typeof r[key]==='number'?'int':(key==='stack'?'string[]':(key==='lede'?'text':'string'));
      rows.push([key,t,esc(r[key]),key==='lede'?1:0]); }
    if(r.sub&&r.sub.length) rows.push(['children','relation[]',esc(r.sub.join(' · ')),0]);
    return {t:String(r.slug).toUpperCase(),ty:'record',rows:rows}; }
  return {t:String(p[2]).toUpperCase(),ty:'field · text[]',
    rows:(SUB[p[2]]||[]).map(function(b){return [b[0],'text',esc(b[1]),1];})};
}
function renderDatos(){

  if(S.focusCol<0) S.focusCol=0;

        return '<button class="item'+(c.lvl===S.focusCol?'':' dim')+'" data-lvl="'+c.lvl+

          '<span class="imeta">'+esc(it.meta)+'</span>'+

  }).join('');
  html+='<div class="col pane"><div class="colhead">DETAIL</div><div class="collist">'+
    '<h2 tabindex="-1">'+esc(d.t)+'</h2><p class="ptype">'+esc(d.ty)+'</p>'+
    d.rows.map(function(f){return '<div class="field'+(f[3]?' wide':'')+'">'+

      '<span class="fval">'+f[2]+'</span></div>';}).join('')+'</div></div>';
  dtrack.innerHTML=html;

  var els=dtrack.querySelectorAll('.col'),last=els.length-1,total=0;
  for(var i=0;i<els.length;i++){var dist=last-i;
    els[i].style.transform='translateZ('+(-dist*56)+'px)';

    els[i].classList.toggle('live',i===S.focusCol); total+=els[i].offsetWidth;}
  dtrack.style.transform=(total>dexp.clientWidth&&innerWidth>900)?
    'translateX('+(dexp.clientWidth-total)+'px)':'translateX(0)';

    segs.push(i===p.length-1?'<span class="here">'+esc(x)+'</span>':
      '<button data-j="'+(i+1)+'">'+esc(x)+'</button>');});
  dpath.innerHTML=segs.join('');
}

    var c=e.target.closest('.chip'); if(c) lay(+c.dataset.i,true);});
  lay(sel,false);
  if(!RM) gsap.fromTo('#diseno .chip',{y:70,opacity:0,scale:.9},
    {y:0,opacity:1,duration:.85,ease:'expo.out',stagger:.06,onComplete:function(){lay(sel,true);}});
}

/* =========================================================
   EL PASAJE — despinta / pinta, conservando posición
   ========================================================= */
var flyer=document.getElementById('flyer'),curtain=document.getElementById('curtain');
function anchorRect(){ var a=document.querySelector('[data-anchor]');
  if(!a) return null; var r=a.getBoundingClientRect();
  return {r:r,txt:a.textContent,el:a,cs:getComputedStyle(a)}; }

function switchWorld(){
  var from=S.world,to=from==='datos'?'diseno':'datos';
  var A=anchorRect();
  S.world=to; document.body.dataset.w=to;
  document.getElementById('datos').classList.toggle('on',to==='datos');
  document.getElementById('diseno').classList.toggle('on',to==='diseno');
  to==='datos'?renderDatos():renderDiseno();

  if(RM) return;
  curtain.style.background=to==='datos'?'#e2e2de':'#0e0b07';
  gsap.fromTo(curtain,{scaleY:0,transformOrigin:from==='diseno'?'bottom':'top'},
    {scaleY:1,duration:.42,ease:'power3.in',
     onComplete:function(){gsap.to(curtain,{scaleY:0,duration:.55,ease:'power3.out',
       transformOrigin:from==='diseno'?'top':'bottom'});}});

  var B=anchorRect();
  if(A&&B){
    var bs=B.cs;
    flyer.style.cssText='position:fixed;z-index:90;pointer-events:none;white-space:nowrap;'+
      'font-family:'+bs.fontFamily+';font-size:'+A.r.height*0.82+'px;font-weight:'+bs.fontWeight+
      ';letter-spacing:-.03em;color:'+(to==='datos'?'#0d0d0c':'#efe4cc')+';';
    flyer.textContent=A.txt;
    gsap.set(B.el,{opacity:0});
    gsap.fromTo(flyer,{left:A.r.left,top:A.r.top,fontSize:A.r.height*.82,opacity:1},
      {left:B.r.left,top:B.r.top,fontSize:B.r.height*.82,duration:.95,ease:'expo.inOut',
       onComplete:function(){gsap.set(flyer,{opacity:0});
         gsap.to(B.el,{opacity:1,duration:.4});}});
  }
}
document.getElementById('sw').addEventListener('click',switchWorld);

/* teclado */
addEventListener('keydown',function(e){
  if(document.getElementById('umbral').style.display==='none'){
    if(e.key==='w'||e.key==='W'){switchWorld();e.preventDefault();return;}
  }
  if(S.world!=='datos') return;
  var items=children(S.path.slice(0,S.focusCol)),cur=S.path[S.focusCol],idx=-1;
  for(var i=0;i<items.length;i++) if(items[i].key===cur) idx=i;
  if(e.key==='ArrowDown'){if(items.length){S.path=S.path.slice(0,S.focusCol);
    S.path[S.focusCol]=items[idx<0?0:(idx+1)%items.length].key;renderDatos();e.preventDefault();}}
  else if(e.key==='ArrowUp'){if(items.length){S.path=S.path.slice(0,S.focusCol);
    S.path[S.focusCol]=items[idx<0?items.length-1:(idx-1+items.length)%items.length].key;
    renderDatos();e.preventDefault();}}
  else if(e.key==='ArrowRight'||e.key==='Enter'){var kids=children(S.path.slice(0,S.focusCol+1));
    if(kids.length){S.focusCol++;S.path[S.focusCol]=kids[0].key;renderDatos();}e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='Escape'){if(S.focusCol>0){S.path=S.path.slice(0,S.focusCol);
    S.focusCol--;renderDatos();}e.preventDefault();}
});

/* umbral */
document.getElementById('umbral').addEventListener('click',function(e){
  var b=e.target.closest('.half'); if(!b) return;
  var w=b.dataset.w; S.world=w; document.body.dataset.w=w;
  document.getElementById('datos').classList.toggle('on',w==='datos');
  document.getElementById('diseno').classList.toggle('on',w==='diseno');
  w==='datos'?renderDatos():renderDiseno();
  var u=this;
  gsap.to(u,{opacity:0,duration:.6,ease:'power2.out',
    onComplete:function(){u.style.display='none';}});
});

renderDatos();
addEventListener('resize',function(){ if(S.world==='datos') renderDatos(); });
})();
</script>
